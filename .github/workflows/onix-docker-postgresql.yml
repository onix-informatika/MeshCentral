name: Onix Docker PostgreSQL

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

env:
  image_name: ghcr.io/${{ github.repository_owner }}/meshcentral

jobs:
  build:
    name: Build PostgreSQL image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image tags
        id: image_meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          epoch_tag="$(date -u +%s)"
          echo "image_tag=${epoch_tag}" >> "$GITHUB_OUTPUT"
          echo "semver_tag=0.0.${epoch_tag}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.image_name }}:${{ steps.image_meta.outputs.image_tag }}
            ${{ env.image_name }}:${{ steps.image_meta.outputs.semver_tag }}
            ${{ env.image_name }}:master-postgresql
            ${{ env.image_name }}:sha-${{ steps.image_meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DISABLE_EXTRACT=yes
            DISABLE_MINIFY=yes
            DISABLE_TRANSLATE=yes
            INCLUDE_MONGODB_TOOLS=false
            INCLUDE_POSTGRESQL_TOOLS=true
            INCLUDE_MARIADB_TOOLS=false
